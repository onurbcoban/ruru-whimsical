services:
  app:
    image: ghcr.io/onurbcoban/ruru-whimsical:infra-vps-docker
    container_name: ruru_app
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://ruru_user:ruru_pass123@db:5432/ruru_db

  db:
    image: postgres:16-alpine
    container_name: ruru_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ruru_user
      POSTGRES_PASSWORD: ruru_pass123
      POSTGRES_DB: ruru_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  nginx:
    image: nginx:alpine
    container_name: ruru_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

volumes:
  postgres_data:
